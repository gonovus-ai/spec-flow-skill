name: Release SpecFlow Skill

on:
  push:
    tags:
      - "skill-v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-specflow-skill
  cancel-in-progress: false

jobs:
  release:
    name: Validate install and create immutable Release
    if: github.repository == 'ztalkai/spec-flow-skill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SKILLS_CLI_VERSION: 1.5.23

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify projection and repository protections
        env:
          GH_TOKEN: ${{ secrets.SKILL_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          source_repository="$(jq -r .source_repository PROVENANCE.json)"
          source_sha="$(jq -r .source_sha PROVENANCE.json)"
          if [[ "${source_repository}" != "gonovus-ai/spec-flow" ]] || \
            [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "${RELEASE_TAG}" =~ ^skill-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || \
            [[ "$(jq -r .source_tag PROVENANCE.json)" != "${RELEASE_TAG}" ]] || \
            [[ "$(git rev-parse "${RELEASE_TAG}^{commit}")" != "${GITHUB_SHA}" ]]; then
            echo "Release tag and projection provenance do not match" >&2
            exit 1
          fi

          .github/verify-repository-protections.sh "${GITHUB_REPOSITORY}"

      - name: Validate public Skill
        run: gh skill publish --dry-run

      - name: Validate exact Release install matrix
        shell: bash
        run: |
          set -euo pipefail
          bash .github/verify-install-matrix.sh \
            release "${GITHUB_WORKSPACE}" "${RELEASE_TAG}" "${SKILLS_CLI_VERSION}"

      - name: Create immutable Release
        env:
          GH_TOKEN: ${{ secrets.SKILL_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          release_url="$(gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${RELEASE_TAG}" \
            -f name="${RELEASE_TAG}" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .url)"
          release="$(gh api --method PATCH "${release_url}" -F draft=false)"
          if [[ "$(jq -r .immutable <<<"${release}")" != "true" ]]; then
            gh api --method DELETE "${release_url}"
            echo "Release immutability is not enabled" >&2
            exit 1
          fi
